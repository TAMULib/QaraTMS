name: qaratms

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    container_name: nginx
    ports:
      - 80:80
    volumes:
      - app-volume:/var/www
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    container_name: app
    ports:
      - 9000:9000
    volumes:
      - app-volume:/var/www
    depends_on:
      - mysqldb
    environment:
      APP_URL: "http://localhost"
      DB_HOST: "mysqldb"
      DB_DATABASE: "qaratms"
      DB_USERNAME: "qaratms"
      DB_PASSWORD: "qaratms"
      DB_PORT: 3306
    user: www-data:www-data
    # user: root:root

  mysqldb:
    image: 'mysql:8'
    container_name: "mysqldb"
    environment:
      MYSQL_DATABASE: "qaratms"
      MYSQL_USER: "qaratms"
      MYSQL_PASSWORD: "qaratms"
      MYSQL_ROOT_PASSWORD: "qaratms"
    command: '--character-set-server=utf8 --collation-server=utf8_general_ci'
    restart: unless-stopped
    ports:
      - 3306:3306
    volumes:
      - database-volume:/var/lib/mysql

volumes:
  database-volume:
    driver: local
  app-volume:
    driver: local

